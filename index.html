<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>하루기록 — 오늘의 업무를 기록하세요</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20243a;
      --muted: #777d91;
      --line: #e9eaf0;
      --purple: #635bdb;
      --purple-light: #f0efff;
      --surface: #fff;
      --bg: #f6f7fb;
      --green: #19866c;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      height: 72px; padding: 0 max(24px, calc((100vw - 1120px) / 2));
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.6px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: white; background: var(--purple); font-size: 19px; }
    .top-date { color: var(--muted); font-size: 13px; }
    main { width: min(1120px, calc(100% - 40px)); margin: 42px auto 72px; }
    .intro { margin-bottom: 28px; }
    .eyebrow { color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    h1 { margin: 9px 0 8px; font-size: clamp(26px, 4vw, 34px); letter-spacing: -1.5px; }
    .intro p { color: var(--muted); margin: 0; font-size: 15px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(270px, .85fr); gap: 22px; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 5px 22px #27264c08; }
    .form-card { padding: 28px; }
    .question { display: block; margin-bottom: 12px; }
    .question.active { animation: none; }
    .step-icon, .question .hint { display: none; }
    .question h2 { flex: 0 0 310px; margin: 0; font-size: 13px; letter-spacing: -.2px; line-height: 1.4; }
    textarea, input[type="text"], input[type="date"] {
      display: block; width: 100%; padding: 14px 15px; color: var(--ink);
      border: 1px solid #dedfe8; border-radius: 11px; outline: none; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"], input[type="date"] { min-width: 0; padding: 10px 12px; font-size: 13px; }
    textarea:focus, input[type="text"]:focus, input[type="date"]:focus { border-color: var(--purple); box-shadow: 0 0 0 3px #635bdb18; }
    textarea::placeholder, input::placeholder { color: #adb0be; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { border: 1px solid var(--line); background: white; border-radius: 20px; padding: 7px 11px; color: #555b6e; font-size: 12px; }
    .chip:hover { color: var(--purple); border-color: #c9c6ff; background: #fafaff; }
    .identity-fields { display: grid; flex: 1; grid-template-columns: 1fr 1fr; gap: 12px; }
    .identity-fields .identity-label { display: flex; align-items: center; gap: 9px; }
    .identity-fields .identity-label input { flex: 1; }
    .identity-fields input[type="text"] { min-height: 0; padding: 10px 12px; font-size: 13px; }
    .question:not(:first-child) { display: flex; align-items: center; gap: 12px; }
    .question:not([data-step="0"]) textarea { min-height: 126px; padding: 20px; font-size: 18px; line-height: 1.6; text-align: left; resize: vertical; }
    .quick-notes { margin-bottom: 19px; padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: #fbfbfe; }
    .quick-notes label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    .quick-notes textarea { display: block; width: 100%; min-height: 76px; padding: 11px 12px; border: 1px solid #dedfe8; border-radius: 9px; outline: none; resize: vertical; line-height: 1.55; }
    .quick-notes textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px #635bdb18; }
    .quick-notes-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 9px; }
    .quick-notes-footer span { color: var(--muted); font-size: 11px; }
    .form-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .step-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn { border: 0; border-radius: 10px; padding: 11px 17px; font-weight: 700; font-size: 13px; }
    .btn-primary { color: white; background: var(--purple); }
    .btn-primary:hover { background: #5149c6; }
    .btn-secondary { color: #666b7d; background: #f1f2f6; }
    .btn-secondary:hover { background: #e9eaf0; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .sidebar { display: grid; gap: 18px; }
    .date-card { padding: 21px; }
    .identity-fields { display: grid; gap: 14px; }
    .identity-label { display: grid; gap: 7px; color: #555b6e; font-size: 13px; font-weight: 700; }
    .date-title { margin: 0 0 14px; font-size: 14px; }
    .date-input { padding: 10px 12px !important; font-size: 13px; }
    .archive-card { padding: 21px; }
    .archive-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .archive-head h2 { margin: 0; font-size: 15px; }
    .count { padding: 4px 8px; border-radius: 20px; background: var(--purple-light); color: var(--purple); font-weight: 700; font-size: 11px; }
    .entry-list { display: grid; gap: 9px; }
    .empty { padding: 18px 8px; color: #999eae; text-align: center; font-size: 12px; line-height: 1.6; }
    .entry { display: flex; justify-content: space-between; gap: 8px; padding: 11px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
    .entry:hover, .entry.selected { border-color: #c9c6ff; background: #fafaff; }
    .entry-date { font-size: 12px; font-weight: 700; }
    .entry-preview { overflow: hidden; max-width: 200px; margin-top: 4px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .entry-delete { align-self: center; border: 0; color: #a0a4b1; background: transparent; font-size: 16px; }
    .entry-delete:hover { color: #d04b61; }
    .result { display: none; margin-top: 22px; padding: 23px; }
    .result.show { display: block; }
    .result-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .result h2 { margin: 0; font-size: 17px; }
    .result-date { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .result-body { white-space: pre-wrap; line-height: 1.8; font-size: 14px; }
    .result-actions { display: flex; gap: 8px; }
    .result-actions .btn { padding: 8px 11px; font-size: 12px; }
    .pdf-help { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); padding: 11px 17px; border-radius: 10px; color: white; background: #24263a; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @page { size: A4; margin: 18mm; }
    @media print {
      body { color: #111; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .topbar, .intro, .form-card, .sidebar, .toast, .result-actions { display: none !important; }
      main { width: 100%; margin: 0; }
      .layout { display: block; }
      .result, .result.show { display: block !important; margin: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      .result-head { display: block; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid #aaa; }
      .result h2 { font-size: 22px; }
      .result-date { margin-top: 6px; color: #333; font-size: 12px; }
      .result-body { color: #111; font-size: 12pt; line-height: 2; overflow-wrap: anywhere; }
    }
    @media (max-width: 760px) {
      .topbar { height: 62px; padding: 0 20px; }
      main { margin-top: 30px; width: min(100% - 28px, 560px); }
      .layout { grid-template-columns: 1fr; }
      .form-card { padding: 21px; }
      .question:not(:first-child) { align-items: flex-start; flex-direction: column; gap: 7px; }
      .question h2 { flex-basis: auto; }
      .identity-fields { grid-template-columns: 1fr; }
      .identity-fields .identity-label { align-items: flex-start; flex-direction: column; gap: 6px; }
      .quick-notes-footer { align-items: flex-start; flex-direction: column; }
      .sidebar { grid-template-columns: 1fr; }
      .result-head { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">하</span> 하루기록</div>
    <div class="top-date" id="topDate"></div>
  </header>
  <main>
    <section class="intro">
      <div class="eyebrow">MY DAILY WORK LOG</div>
      <h1>오늘의 업무일지</h1>
      <p>회사에서 받은 양식 순서대로 작성해 저장하세요.</p>
    </section>
    <div class="layout">
      <section>
        <div class="card form-card">
          <form id="logForm">
            <div class="quick-notes">
              <label for="quickNotes">빠른 메모 입력</label>
              <textarea id="quickNotes" placeholder="오늘 있었던 일을 편하게 적어 주세요. 예: 오전에 회의 참석. 보고서 초안 작성 완료. 내일 고객사에 전달 예정."></textarea>
              <div class="quick-notes-footer">
                <span>문장별 키워드를 기준으로 해당 항목에 나눠 넣습니다.</span>
                <button class="btn btn-secondary" id="organizeNotesBtn" type="button">메모를 항목별로 나누기</button>
              </div>
            </div>
            <div class="question active" data-step="0">
              <div class="identity-fields">
                <label class="identity-label" for="employeeName">이름(姓名)
                  <input id="employeeName" type="text" autocomplete="name" placeholder="이름을 입력하세요">
                </label>
                <label class="identity-label" for="logDate">날짜(日期)
                  <input class="date-input" id="logDate" type="date" aria-label="업무일지 날짜">
                </label>
              </div>
            </div>
            <div class="question" data-step="1">
              <h2>① 오늘 지시받은 업무 (今日指派工作)</h2>
              <textarea id="assigned" placeholder="오늘 지시받은 업무를 입력하세요."></textarea>
            </div>
            <div class="question" data-step="2">
              <h2>② 오늘 완료한 업무 (今日完成工作)</h2>
              <textarea id="completed" placeholder="오늘 완료한 업무를 입력하세요."></textarea>
            </div>
            <div class="question" data-step="3">
              <h2>③ 해결하지 못한 문제 (未解决问题)</h2>
              <textarea id="unresolved" placeholder="해결하지 못한 문제를 입력하세요."></textarea>
            </div>
            <div class="question" data-step="4">
              <h2>④ 오늘 배운 내용 (今日 容 学习内)</h2>
              <textarea id="learned" placeholder="오늘 배운 내용을 입력하세요."></textarea>
            </div>
            <div class="question" data-step="5">
              <h2>⑤ 내일 할 일 (明日)</h2>
              <textarea id="next" placeholder="내일 할 일을 입력하세요."></textarea>
            </div>
            <div class="step-actions">
              <div class="form-tools">
                <button class="btn btn-secondary" id="polishBtn" type="button">업무일지 문장으로 다듬기</button>
              </div>
              <button class="btn btn-primary" id="saveBtn" type="submit">업무일지 저장하기</button>
              <button class="btn btn-secondary" id="savePdfBtn" type="button">저장 후 PDF 열기</button>
            </div>
          </form>
        </div>
        <section class="card result" id="result">
          <div class="result-head">
            <div><h2>오늘의 업무일지</h2><div class="result-date" id="resultDate"></div></div>
            <div class="result-actions">
              <button class="btn btn-primary" id="shareBtn" type="button">공유하기</button>
              <button class="btn btn-secondary" id="copyBtn" type="button">복사</button>
              <button class="btn btn-secondary" id="downloadBtn" type="button">텍스트 저장</button>
              <button class="btn btn-secondary" id="pdfBtn" type="button" title="저장 창에서 내 컴퓨터의 폴더를 선택하세요.">내 컴퓨터에 PDF 저장</button>
            </div>
          </div>
          <div class="result-body" id="resultBody"></div>
          <p class="pdf-help">버튼을 누른 뒤 저장 창에서 PDF로 저장을 선택하고, 컴퓨터의 저장 위치를 지정하세요.</p>
        </section>
      </section>
      <aside class="sidebar">
        <div class="card archive-card">
          <div class="archive-head"><h2>지난 업무일지</h2><span class="count" id="entryCount">0개</span></div>
          <div class="entry-list" id="entryList"></div>
        </div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const fields = ["employeeName", "assigned", "completed", "unresolved", "learned", "next"];
      const form = document.getElementById("logForm");
      const dateInput = document.getElementById("logDate");
      const result = document.getElementById("result");
      const storeKey = "haru-record-work-logs";
      const originalTitle = document.title;
      let selectedDate = "";
      let toastTimer;
      const today = new Date();
      const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      dateInput.value = localDate;
      document.getElementById("topDate").textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(today);

      function getLogs() {
        try {
          const logs = JSON.parse(localStorage.getItem(storeKey) || "{}");
          if (!logs || typeof logs !== "object" || Array.isArray(logs)) return {};
          return Object.fromEntries(Object.entries(logs).map(([date, log]) => {
            const entry = log && typeof log === "object" ? log : {};
            const oldCompleted = [entry.work, entry.achievement].filter((value) => typeof value === "string" && value.trim());
            return [date, {
              employeeName: typeof entry.employeeName === "string" ? entry.employeeName : "",
              assigned: typeof entry.assigned === "string" ? entry.assigned : "",
              completed: typeof entry.completed === "string" ? entry.completed : oldCompleted.join("\n"),
              unresolved: typeof entry.unresolved === "string" ? entry.unresolved : typeof entry.blocker === "string" ? entry.blocker : "",
              learned: typeof entry.learned === "string" ? entry.learned : "",
              next: typeof entry.next === "string" ? entry.next : ""
            }];
          }));
        } catch (error) {
          console.error("업무일지를 불러오지 못했습니다.", error);
          showToast("저장된 업무일지를 불러오지 못했어요.");
          return {};
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function makeReport(date, log) {
        const reportDate = date.replaceAll("-", ".");
        const sections = [
          ["① 오늘 지시받은 업무 (今日指派工作)", log.assigned],
          ["② 오늘 완료한 업무 (今日完成工作)", log.completed],
          ["③ 해결하지 못한 문제 (未解决问题)", log.unresolved],
          ["④ 오늘 배운 내용 (今日 容 学习内)", log.learned],
          ["⑤ 내일 할 일 (明日)", log.next]
        ];
        return [
          "일일 업무일지",
          `이름(姓名): ${log.employeeName || "미입력"}    날짜(日期): ${reportDate}`,
          "━━━━━━━━━━━━━━━━━━━━",
          ...sections.flatMap(([title, value]) => [title, value.trim() || "기록 없음", ""])
        ].join("\n");
      }

      function appendToField(fieldId, text) {
        const field = document.getElementById(fieldId);
        const entry = text.trim();
        if (!entry) return;
        field.value = field.value.trim() ? `${field.value.trim()} / ${entry}` : entry;
        resizeEntry(field);
      }

      function resizeEntry(field) {
        field.style.height = "auto";
        field.style.height = `${Math.max(126, field.scrollHeight)}px`;
      }

      function classifyNote(sentence) {
        if (/내일|익일|향후|예정|계획|할\s*일|추진할|진행할|예정이/.test(sentence)) return "next";
        if (/문제|미해결|해결\s*(?:못|되지)|어려움|지연|막힘|오류|장애|불가|필요|부족/.test(sentence)) return "unresolved";
        if (/배웠|배움|배우|학습|교육|숙지|익혔|알게\s*되|이해했|새롭게\s*알/.test(sentence)) return "learned";
        if (/지시|지정|요청|전달받|할당|맡았/.test(sentence)) return "assigned";
        if (/완료|마무리|작성|제출|진행|처리|참석|확인|검토|수정|공유|정리|지원|관리|조사|분석|개발|제작|배포|응대|보고|수행|회신|설계|구현|테스트|점검/.test(sentence)) return "completed";
        return "";
      }

      function organizeNotes() {
        const notes = document.getElementById("quickNotes");
        const raw = notes.value.trim();
        if (!raw) {
          showToast("먼저 오늘 한 일을 메모해 주세요.");
          notes.focus();
          return;
        }
        const sentences = raw.split(/\n+|(?<=[.!?。；;])\s*/).map((sentence) => sentence.trim()).filter(Boolean);
        const unclassified = [];
        let classifiedCount = 0;
        sentences.forEach((sentence) => {
          const field = classifyNote(sentence);
          if (!field) {
            unclassified.push(sentence);
            return;
          }
          appendToField(field, sentence.replace(/[.!?。；;]+$/, ""));
          classifiedCount += 1;
        });
        notes.value = unclassified.join("\n");
        if (classifiedCount && unclassified.length) {
          showToast(`${classifiedCount}개 문장을 나눴어요. 분류되지 않은 메모는 위에 남겨 뒀어요.`);
        } else if (classifiedCount) {
          showToast(`${classifiedCount}개 문장을 업무일지 항목에 나눴어요.`);
        } else {
          showToast("자동 분류할 수 있는 문장이 없어요. 메모를 직접 항목에 옮겨 주세요.");
        }
      }

      function polishText(text) {
        return text.split(/\s*\/\s*/).map((part) => {
          const value = part.trim();
          if (!value || /[.!?。]$/.test(value)) return value;
          if (/^(?:특이사항\s*없음|없음|해당\s*없음)$/.test(value)) return `${value}.`;
          if (/했어요$/.test(value)) return `${value.replace(/했어요$/, "했습니다.")}`;
          if (/했음$/.test(value)) return `${value.replace(/했음$/, "했습니다.")}`;
          if (/해요$/.test(value)) return `${value.replace(/해요$/, "합니다.")}`;
          if (/됐어요$/.test(value)) return `${value.replace(/됐어요$/, "되었습니다.")}`;
          if (/지연됨$/.test(value)) return `${value.replace(/지연됨$/, "지연되었습니다.")}`;
          if (/배움$/.test(value)) return `${value.replace(/배움$/, "배웠습니다.")}`;
          if (/예정$/.test(value)) return `${value}입니다.`;
          if (/완료$/.test(value)) return `${value}했습니다.`;
          if (/(?:작성|검토|수정|정리|확인|조사|분석|공유|제출|처리|관리|준비|참석|지원|개발|설계|구현|테스트|점검|진행|수행|보고|응대|회신)$/.test(value)) return `${value}했습니다.`;
          return `${value}.`;
        }).filter(Boolean).join(" / ");
      }

      function renderLog(date, log) {
        selectedDate = date;
        dateInput.value = date;
        document.getElementById("quickNotes").value = "";
        fields.forEach((field) => {
          const input = document.getElementById(field);
          input.value = log[field] || "";
          if (input.tagName === "TEXTAREA") resizeEntry(input);
        });
        document.getElementById("resultDate").textContent = new Intl.DateTimeFormat("ko-KR", {
          year: "numeric", month: "long", day: "numeric"
        }).format(new Date(`${date}T00:00:00`));
        document.getElementById("resultBody").textContent = makeReport(date, log);
        result.classList.add("show");
        renderEntries();
      }

      function renderEntries() {
        const logs = getLogs();
        const dates = Object.keys(logs).sort((a, b) => b.localeCompare(a));
        const list = document.getElementById("entryList");
        document.getElementById("entryCount").textContent = `${dates.length}개`;
        list.replaceChildren();
        if (!dates.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "아직 기록이 없어요.\n첫 업무일지를 남겨 보세요!";
          list.append(empty);
          return;
        }
        dates.forEach((date) => {
          const item = document.createElement("div");
          item.className = `entry${date === selectedDate ? " selected" : ""}`;
          const text = document.createElement("div");
          const dateLabel = document.createElement("div");
          dateLabel.className = "entry-date";
          dateLabel.textContent = new Intl.DateTimeFormat("ko-KR", { month: "long", day: "numeric", weekday: "short" })
            .format(new Date(`${date}T00:00:00`));
          const preview = document.createElement("div");
          preview.className = "entry-preview";
          preview.textContent = logs[date].assigned || logs[date].completed || "업무일지";
          text.append(dateLabel, preview);
          const remove = document.createElement("button");
          remove.className = "entry-delete";
          remove.type = "button";
          remove.setAttribute("aria-label", `${date} 업무일지 삭제`);
          remove.textContent = "×";
          remove.addEventListener("click", (event) => {
            event.stopPropagation();
            if (!window.confirm("이 업무일지를 삭제할까요?")) return;
            const updated = getLogs();
            delete updated[date];
            try {
              localStorage.setItem(storeKey, JSON.stringify(updated));
              if (selectedDate === date) {
                selectedDate = "";
                result.classList.remove("show");
                form.reset();
                dateInput.value = date;
              }
              renderEntries();
              showToast("업무일지를 삭제했어요.");
            } catch (error) {
              console.error("업무일지를 삭제하지 못했습니다.", error);
              showToast("삭제하지 못했어요. 브라우저 저장 공간을 확인해 주세요.");
            }
          });
          item.addEventListener("click", () => renderLog(date, logs[date]));
          item.append(text, remove);
          list.append(item);
        });
      }

      dateInput.addEventListener("change", () => {
        const date = dateInput.value;
        if (!date) return;
        const existing = getLogs()[date];
        if (existing) renderLog(date, existing);
        else {
          selectedDate = "";
          result.classList.remove("show");
          document.getElementById("quickNotes").value = "";
          fields.slice(1).forEach((field) => { document.getElementById(field).value = ""; });
          dateInput.value = date;
          renderEntries();
        }
      });

      fields.slice(1).forEach((field) => {
        document.getElementById(field).addEventListener("input", (event) => resizeEntry(event.currentTarget));
      });

      document.getElementById("organizeNotesBtn").addEventListener("click", organizeNotes);
      document.getElementById("polishBtn").addEventListener("click", () => {
        let changed = 0;
        fields.slice(1).forEach((field) => {
          const input = document.getElementById(field);
          const polished = polishText(input.value);
          if (polished !== input.value.trim()) changed += 1;
          input.value = polished;
          resizeEntry(input);
        });
        showToast(changed ? `${changed}개 항목을 업무일지 문장으로 다듬었어요.` : "다듬을 문장이 없거나 이미 문장 형식이에요.");
      });

      function saveLog(openPdfAfterSave = false) {
        const log = Object.fromEntries(fields.map((field) => [field, document.getElementById(field).value.trim()]));
        const date = dateInput.value;
        if (!date) {
          showToast("날짜를 선택해 주세요.");
          dateInput.focus();
          return false;
        }
        const logs = getLogs();
        logs[date] = log;
        try {
          localStorage.setItem(storeKey, JSON.stringify(logs));
          renderLog(date, log);
          showToast("업무일지를 저장했어요.");
          if (openPdfAfterSave) openPdf();
          return true;
        } catch (error) {
          console.error("업무일지를 저장하지 못했습니다.", error);
          showToast("저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.");
          return false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        saveLog();
      });
      document.getElementById("savePdfBtn").addEventListener("click", () => saveLog(true));

      document.getElementById("copyBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(document.getElementById("resultBody").textContent);
          showToast("업무일지를 복사했어요.");
        } catch (error) {
          console.error("클립보드에 복사하지 못했습니다.", error);
          showToast("복사하지 못했어요. 브라우저 권한을 확인해 주세요.");
        }
      });
      document.getElementById("shareBtn").addEventListener("click", async () => {
        if (!selectedDate || !result.classList.contains("show")) {
          showToast("먼저 업무일지를 저장하거나 지난 기록을 선택해 주세요.");
          return;
        }
        const text = document.getElementById("resultBody").textContent;
        if (typeof navigator.share === "function") {
          try {
            await navigator.share({ title: `업무일지-${selectedDate}`, text });
            showToast("공유 메뉴에서 보낼 방법을 선택해 주세요.");
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
            console.error("공유 메뉴를 열지 못했습니다.", error);
          }
        }
        try {
          await navigator.clipboard.writeText(text);
          showToast("업무일지를 복사했어요. 메신저나 메일에 붙여 넣어 보내세요.");
        } catch (error) {
          console.error("업무일지를 공유하거나 복사하지 못했습니다.", error);
          showToast("공유 메뉴를 사용할 수 없어요. 복사 버튼을 사용해 주세요.");
        }
      });
      document.getElementById("downloadBtn").addEventListener("click", () => {
        const content = `${document.getElementById("resultBody").textContent}\n`;
        const url = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `업무일지-${selectedDate}.txt`;
        link.click();
        URL.revokeObjectURL(url);
      });
      function openPdf() {
        if (!selectedDate || !result.classList.contains("show")) {
          showToast("먼저 업무일지를 저장하거나 지난 기록을 선택해 주세요.");
          return;
        }
        document.title = `업무일지-${selectedDate}`;
        try {
          window.print();
        } catch (error) {
          document.title = originalTitle;
          console.error("PDF 저장 창을 열지 못했습니다.", error);
          showToast("PDF 저장 창을 열지 못했어요. 브라우저의 인쇄 기능을 확인해 주세요.");
        }
      }
      document.getElementById("pdfBtn").addEventListener("click", openPdf);
      window.addEventListener("afterprint", () => { document.title = originalTitle; });

      renderEntries();
      const existingToday = getLogs()[localDate];
      if (existingToday) renderLog(localDate, existingToday);
    })();
  </script>
</body>
</html>
