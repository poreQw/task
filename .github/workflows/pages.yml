name: Deploy daily work log to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare site files
        run: |
          mkdir -p _site/supabase
          cp index.html _site/index.html
          cp supabase/config.js _site/supabase/config.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
